<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Expenses</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #4caf50;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
      z-index: 999;
    }
    .expense-item {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .summary-report {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .summary-report table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-report th, .summary-report td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Poultry Management</h2>
      <ul>
        <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
        <li><a href="../expense/expense.html">Manage Expenses</a></li>
        <li><a href="../sale/sale.html">Manage Sales</a></li>
        <li><a href="../feeding/feeding.html">Manage Feeding</a></li>
        <li><a href="../medication/medication.html">Manage Medication</a></li>
        <li><a href="../egg/egg.html">Manage Egg Collection</a></li>
      </ul>
      <button id="logoutBtn" style="background:#f44336;color:white;padding:10px;border:none;border-radius:5px;">Logout</button>
    </div>

    <div class="main-content">
      <h1>Manage Expenses</h1>

      <input type="text" id="searchCategory" placeholder="Search by Category..." />
      <form id="expenseForm">
        <select id="expenseCategory" required>
          <option value="">-- Select Category --</option>
          <option value="Feed">Feed</option>
          <option value="Medication">Medication</option>
          <option value="Utilities">Utilities</option>
          <option value="Equipment">Equipment</option>
          <option value="Labor">Labor</option>
          <option value="Others">Others</option>
        </select>
        <span class="tooltip">Select a category from the list, or enter a custom category.</span>
        <input type="text" id="customCategory" placeholder="If 'Others', type category..." style="display:none;" />

        <input type="number" id="expenseAmount" placeholder="Amount" required />
        <input type="text" id="expenseDescription" placeholder="Description" />
        <button type="submit">Add Expense</button>
      </form>
      <button onclick="downloadCSV()">Export to CSV</button>

      <div id="expenseList"></div>

      <!-- Expense Summary Report -->
      <div class="summary-report" id="summaryReport">
        <h3>Expense Summary by Category</h3>
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Total Amount</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody">
            <!-- Dynamic summary rows will appear here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Saved!</div>

  <script src="../auth/auth.js"></script>
  <script>
    protectDashboard();

    document.getElementById("logoutBtn").addEventListener("click", function() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "/features/auth/login.html";
    });

    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.innerText = message;
      toast.style.display = "block";
      setTimeout(() => (toast.style.display = "none"), 3000);
    }

    let editIndex = null;

    const expenseForm = document.getElementById("expenseForm");
    const expenseList = document.getElementById("expenseList");
    const summaryTableBody = document.getElementById("summaryTableBody");

    function loadExpenses(filter = "") {
      const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
      const filtered = expenses.filter(e => e.category.toLowerCase().includes(filter.toLowerCase()));
      
      expenseList.innerHTML = "";

      if (filtered.length === 0) {
        expenseList.innerHTML = "<p style='color:gray;'>No expenses found.</p>";
      }

      filtered.forEach((exp, index) => {
        const div = document.createElement("div");
        div.className = "expense-item";
        div.innerHTML = `
          <strong>${exp.category}</strong> - ₱${exp.amount}<br/>
          ${exp.description} <br/>
          <small>${exp.date}</small><br/>
          <button onclick="editExpense(${index})">Edit</button>
          <button onclick="deleteExpense(${index})">Delete</button>
        `;
        expenseList.appendChild(div);
      });

      updateSummary();
    }


    

    function updateSummary() {
      const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
      const summary = {};

      expenses.forEach(exp => {
        if (!summary[exp.category]) {
          summary[exp.category] = 0;
        }
        summary[exp.category] += parseFloat(exp.amount);
      });

      summaryTableBody.innerHTML = "";

      Object.keys(summary).forEach(category => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${category}</td>
          <td>₱${summary[category].toFixed(2)}</td>
        `;
        summaryTableBody.appendChild(row);
      });
    }

    function saveExpenses(expenses) {
      localStorage.setItem("expenses", JSON.stringify(expenses));
    }

    expenseForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const categorySelect = document.getElementById("expenseCategory");
      let category = categorySelect.value;
      if (category === "Others") {
        category = document.getElementById("customCategory").value.trim();
        if (!category) {
          alert("Please enter a custom category.");
          return;
        }
      }

      const amount = document.getElementById("expenseAmount").value;
      const description = document.getElementById("expenseDescription").value;
      const date = new Date().toLocaleString();

      let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

      if (editIndex !== null) {
        expenses[editIndex] = { category, amount, description, date };
        editIndex = null;
        showToast("Expense updated!");
      } else {
        expenses.push({ category, amount, description, date });
        showToast("Expense added!");
      }

      saveExpenses(expenses);
      expenseForm.reset();
      categorySelect.selectedIndex = 0;
      document.getElementById("customCategory").style.display = "none";
      loadExpenses();
    });

    


    function editExpense(index) {
      const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
      const exp = expenses[index];
      document.getElementById("expenseCategory").value = exp.category;
      document.getElementById("expenseAmount").value = exp.amount;
      document.getElementById("expenseDescription").value = exp.description;
      editIndex = index;
    }

    function deleteExpense(index) {
      const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
      expenses.splice(index, 1);
      saveExpenses(expenses);
      loadExpenses();
      showToast("Expense deleted!");
    }

    function downloadCSV() {
      const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
      if (expenses.length === 0) {
        alert("No expenses to export.");
        return;
      }

      const csvRows = [["Category", "Amount", "Description", "Date"]];
      expenses.forEach(exp => {
        csvRows.push([exp.category, exp.amount, exp.description, exp.date]);
      });

      const csvContent = csvRows.map(e => e.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "expenses.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("searchCategory").addEventListener("input", function () {
      loadExpenses(this.value);
    });

    // Show/hide custom category input
    document.getElementById("expenseCategory").addEventListener("change", function () {
      const customInput = document.getElementById("customCategory");
      if (this.value === "Others") {
        customInput.style.display = "block";
        customInput.required = true;
      } else {
        customInput.style.display = "none";
        customInput.required = false;
      }
    });

    loadExpenses();

    function deleteExpense(index) {
  if (confirm("Are you sure you want to delete this expense?")) {
    const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
    expenses.splice(index, 1);
    saveExpenses(expenses);
    loadExpenses();
    showToast("Expense deleted!");
  }
}

  </script>
</body>
</html>
